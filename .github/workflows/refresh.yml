# Relay for the dashboard's Refresh button: browsers can't call the Claude routine directly,
# so the page starts this workflow, which calls the routine's fire URL with the FIRE_TOKEN secret.
name: Pull new numbers
on: workflow_dispatch
concurrency:
  group: pull-new-numbers
  cancel-in-progress: false
permissions: {}
jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the Claude refresh routine
        env:
          FIRE_TOKEN: ${{ secrets.FIRE_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/trig_01YHAaUdJnFrsdUCSrYPjZbZ/fire" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"text":"Refresh tapped on the dashboard"}')
          echo "HTTP $code"
          test "$code" -lt 300
